name: components
description: "UI Components for Civic24"
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # General Dependencies
  smooth_page_indicator: ^3.0.0
  solar_icons: ^0.1.0
  iconsax_plus: ^1.0.0
  font_awesome_flutter: ^11.0.0
  dotted_border: ^3.1.0
  flutter_animate: ^4.5.2
  shimmer: ^4.0.0
  cached_network_image: ^4.0.2
  overlay_support: ^2.1.0

  # Package Dependencies
  assets:
    path: ../assets
  constants:
    path: ../constants
  localization:
    path: ../localization
  models:
    path: ../models
  styles:
    path: ../styles
  utils:
    path: ../utils

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Internal Packages
  rules:
    path: ../rules

  # Utility Packages
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
