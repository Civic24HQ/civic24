name: models
description: "Models for Civic24"
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
    
  # General Dependencies
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  uuid: ^4.6.0
  faker: ^2.2.0
  solar_icons: ^0.1.0
  cloud_firestore: ^6.1.2
  meta: ^1.15.0

  # Package Dependencies
  constants:
    path: ../constants
  localization:
    path: ../localization
  utils:
    path: ../utils

dev_dependencies:
  flutter_test:
    sdk: flutter
    
  # Internal Packages
  rules:
    path: ../rules

  # Utility Packages
  freezed: ^4.0.1
  json_serializable: ^6.9.5
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
