name: services
description: "Services for Civic24"
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  
  # Package Dependencies
  constants:
    path: ../constants
  models:
    path: ../models
  utils:
    path: ../utils
  localization:
    path: ../localization

  # State Management
  stacked: ^3.5.0
  stacked_services: ^1.6.0

  # General Dependencies
  permission_handler: ^13.0.2
  rxdart: ^0.28.0
  intl: ^0.20.2
  crypto: ^3.0.7
  logger: ^2.5.0
  hive_ce: ^2.20.0
  path_provider: ^2.1.6
  android_intent_plus: ^6.1.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  flutter_image_compress: ^2.5.1
  exif: ^3.3.0
  app_settings: ^9.0.0
  flutter_local_notifications: ^22.3.1
  http: ^1.6.0
  http_parser: ^4.1.2
  mime: ^2.1.0
  internet_connection_checker_plus: ^3.1.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  geocoding: ^5.0.0
  geolocator: ^14.0.3
  package_info_plus: ^10.2.1
  shorebird_code_push: ^2.0.7

  # Google/Firebase Dependencies
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  firebase_storage: ^13.6.0
  firebase_remote_config: ^6.7.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
    
  # Internal Packages
  rules:
    path: ../rules

  # Utility Packages
  build_runner: ^2.16.1
  stacked_generator: ^2.0.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
