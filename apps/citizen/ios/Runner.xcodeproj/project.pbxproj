			shellScript = "# Extract the flavor from the Build Configuration\nenvironment=\"default\"\nif [[ $CONFIGURATION =~ -([^-]*)$ ]]; then\n  extracted_flavor=${BASH_REMATCH[1]}\nfi\n\n# Map the extracted flavor to the exact folder names\ncase $extracted_flavor in\n  \"prod\" | \"production\")\n    folder_name=\"production\"\n    ;;\n  \"dev\" | \"development\")\n    folder_name=\"development\"\n    ;;\n  \"stg\" | \"staging\")\n    folder_name=\"staging\"\n    ;;\n  *)\n    echo \"Warning: Unrecognized flavor '${extracted_flavor}'. Defaulting to 'development'.\"\n    folder_name=\"development\"\n    ;;\nesac\n\necho \"Active Environment Folder: $folder_name\"\n\n# Define the source path based on the mapped folder\nGOOGLESERVICE_INFO_PLIST=\"GoogleService-Info.plist\"\nGOOGLESERVICE_INFO_FILE=\"${PROJECT_DIR}/config/${folder_name}/${GOOGLESERVICE_INFO_PLIST}\"\n\n# Verify the file exists before attempting to copy\necho \"Looking for ${GOOGLESERVICE_INFO_PLIST} in ${GOOGLESERVICE_INFO_FILE}\"\nif [ ! -f \"$GOOGLESERVICE_INFO_FILE\" ]; then\n  echo \"error: No GoogleService-Info.plist found for environment '$folder_name'. Please ensure it's in the proper directory.\"\n  exit 1\nfi\n\n# Define the standard Xcode destination path\nPLIST_DESTINATION=\"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\necho \"Will copy ${GOOGLESERVICE_INFO_PLIST} to final destination: ${PLIST_DESTINATION}\"\n\n# Execute the copy\ncp \"${GOOGLESERVICE_INFO_FILE}\" \"${PLIST_DESTINATION}/${GOOGLESERVICE_INFO_PLIST}\"\necho \"Successfully copied GoogleService-Info.plist for $folder_name.\"\n";
