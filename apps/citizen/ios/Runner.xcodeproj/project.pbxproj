			shellPath = /bin/sh;
			shellScript = "#!/bin/bash\n# Uploads the debug symbols (dSYM) of release builds to Firebase Crashlytics.\n# Debug builds are skipped. Release builds fail loudly if the upload cannot run,\n# other configurations only warn.\nPATH=\"${PATH}:$FLUTTER_ROOT/bin:${PUB_CACHE}/bin:$HOME/.pub-cache/bin\"\n\ncase \"$CONFIGURATION\" in\n  Debug*) echo \"Debug build: skipping the Crashlytics symbol upload.\"; exit 0 ;;\nesac\n\n# Release-production must upload symbols; anything else only warns.\nreport_problem() {\n  case \"$CONFIGURATION\" in\n    Release-production) echo \"error: $1\" >&2; exit 1 ;;\n    *) echo \"warning: $1 The build continues without uploaded symbols.\" >&2; exit 0 ;;\n  esac\n}\n\nif ! command -v flutterfire >/dev/null 2>&1; then\n  report_problem \"The FlutterFire CLI is not installed (dart pub global activate flutterfire_cli).\"\nfi\n\n# Where Swift Package Manager checked out firebase-ios-sdk:\n# - flutter build ios (command line): <project>/build/ios/SourcePackages\n# - Xcode (build or archive): <DerivedData>/<project>/SourcePackages\nDERIVED_DATA_PATH=$(echo \"$BUILD_ROOT\" | sed -E 's|(.*DerivedData/[^/]+).*|\\1|')\nPATH_TO_CRASHLYTICS_UPLOAD_SCRIPT=\"\"\nfor candidate in \\\n  \"${SRCROOT}/../build/ios/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run\" \\\n  \"${DERIVED_DATA_PATH}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run\"; do\n  if [ -f \"$candidate\" ]; then\n    PATH_TO_CRASHLYTICS_UPLOAD_SCRIPT=\"$candidate\"\n    break\n  fi\ndone\n\nif [ -z \"$PATH_TO_CRASHLYTICS_UPLOAD_SCRIPT\" ]; then\n  report_problem \"Could not find the Crashlytics upload script from firebase-ios-sdk.\"\nfi\n\n# Command to upload symbols script used to upload symbols to Firebase server\nflutterfire upload-crashlytics-symbols --upload-symbols-script-path=\"$PATH_TO_CRASHLYTICS_UPLOAD_SCRIPT\" --platform=ios --apple-project-path=\"${SRCROOT}\" --env-platform-name=\"${PLATFORM_NAME}\" --env-configuration=\"${CONFIGURATION}\" --env-project-dir=\"${PROJECT_DIR}\" --env-built-products-dir=\"${BUILT_PRODUCTS_DIR}\" --env-dwarf-dsym-folder-path=\"${DWARF_DSYM_FOLDER_PATH}\" --env-dwarf-dsym-file-name=\"${DWARF_DSYM_FILE_NAME}\" --env-infoplist-path=\"${INFOPLIST_PATH}\" --default-config=default || report_problem \"The Crashlytics symbol upload failed.\"\n";
