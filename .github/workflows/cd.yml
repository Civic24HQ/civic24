name: CD

# Builds the citizen app (development flavor) for Android and iOS and attaches
# the build to a GitHub Release.
#
# PAUSED: this only runs when started by hand (Actions tab, Run workflow). It
# failed on the first push to develop on Flutter 3.47.5:
#   - Android: the Gradle wrapper (8.13) is older than Flutter's minimum (8.14)
#   - iOS: the FlutterFire packages are at mismatched versions, so Swift Package
#     Manager cannot resolve them
# Those are fixed in Phase 4 (Android) and Phase 2 (Firebase suite). Phase 7 puts
# the push trigger back (`push: branches: [develop]`), fixes the release race
# between the two jobs, and adds store delivery. Pull requests are checked by
# ci.yml, not here.

on:
  workflow_dispatch:

# Never cancel a delivery run half way; queue the next one instead.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS - citizen development
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      APP_DIR: apps/citizen

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies and Melos
        run: |
          flutter pub get
          dart pub global activate melos "$(dart run melos --version)"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          melos bootstrap

      # The secret is passed through an environment variable, never written
      # into the script text.
      - name: Write the environment file
        env:
          ENV_JSON_BASE64: ${{ secrets.ENCODED_DEVELOPMENT_JSON_CITIZEN }}
        run: |
          set -euo pipefail
          [ -n "$ENV_JSON_BASE64" ] || { echo "::error::Missing ENCODED_DEVELOPMENT_JSON_CITIZEN secret"; exit 1; }
          mkdir -p "$APP_DIR/secrets"
          printf '%s' "$ENV_JSON_BASE64" | base64 --decode > "$APP_DIR/secrets/development.json"
          python3 -m json.tool "$APP_DIR/secrets/development.json" > /dev/null

      - name: Reset iOS Pods
        run: rm -rf "$APP_DIR/ios/Pods" "$APP_DIR/ios/Podfile.lock"

      - name: Install FlutterFire CLI
        run: |
          dart pub global activate flutterfire_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Build iOS archive (unsigned)
        working-directory: apps/citizen
        run: |
          flutter build ipa \
            --no-codesign \
            --flavor development \
            --dart-define-from-file=secrets/development.json

      - name: Zip the archive
        working-directory: apps/citizen/build/ios/archive
        run: zip -r AppArchive.zip ./*.xcarchive

      - name: Upload iOS archive to a release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: apps/citizen/build/ios/archive/AppArchive.zip
          tag: citizen-development-v1.0.${{ github.run_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: false

  build-android:
    name: Build Android - citizen development
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      APP_DIR: apps/citizen

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies and Melos
        run: |
          flutter pub get
          dart pub global activate melos "$(dart run melos --version)"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          melos bootstrap

      - name: Write the environment file
        env:
          ENV_JSON_BASE64: ${{ secrets.ENCODED_DEVELOPMENT_JSON_CITIZEN }}
        run: |
          set -euo pipefail
          [ -n "$ENV_JSON_BASE64" ] || { echo "::error::Missing ENCODED_DEVELOPMENT_JSON_CITIZEN secret"; exit 1; }
          mkdir -p "$APP_DIR/secrets"
          printf '%s' "$ENV_JSON_BASE64" | base64 --decode > "$APP_DIR/secrets/development.json"
          python3 -m json.tool "$APP_DIR/secrets/development.json" > /dev/null

      - name: Build Android release APKs
        working-directory: apps/citizen
        run: |
          flutter build apk \
            --release \
            --flavor development \
            --target lib/main.dart \
            --dart-define-from-file=secrets/development.json \
            --split-per-abi

      - name: Upload Android APKs to a release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: apps/citizen/build/app/outputs/apk/development/release/*.apk
          tag: citizen-development-v1.0.${{ github.run_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: false
